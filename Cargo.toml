[package]
name = "vid_recorder"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
cameleon = { version = "0.1.14", features = ["libusb"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.37.0"
fs4 = "1.1.0"
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
rayon = "1.12.0"
rusb = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zune-jpeg = "0.5.15"
