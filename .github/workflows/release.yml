# Build vid_recorder for every platform when a version tag (v*) is pushed and
# publish the archives as a GitHub Release. run.sh / run.ps1 download them.
#
#   1. set `version` in Cargo.toml (e.g. 0.2.0) and commit
#   2. git tag v0.2.0 && git push origin v0.2.0

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, asset: vid_recorder-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: vid_recorder-macos-x86_64 }
          # Older Ubuntu = older glibc, so the binary runs on more distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: vid_recorder-linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: vid_recorder-windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml version $v"; exit 1; }

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libusb-1.0-0-dev libudev-dev clang libclang-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p pkg
          cp target/${{ matrix.target }}/release/vid_recorder run.sh pkg/
          cp -r slog pkg/
          [ "$RUNNER_OS" = Linux ] && cp -r linux pkg/
          echo "$GITHUB_REF_NAME" > pkg/VERSION
          tar -czf ${{ matrix.asset }}.tar.gz -C pkg .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item target/${{ matrix.target }}/release/vid_recorder.exe, run.ps1 pkg/
          Copy-Item -Recurse slog pkg/
          Set-Content pkg/VERSION $env:GITHUB_REF_NAME
          Compress-Archive -Path pkg/* -DestinationPath ${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
